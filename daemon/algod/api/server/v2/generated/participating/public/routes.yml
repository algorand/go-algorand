package: public
generate:
  echo-server: true
output-options:
  include-tags:
  - participating
  - public
  exclude-tags:
  - private
  - common
  - nonparticipating
  - data
  - experimental
  skip-prune: true
  user-templates:
    echo/echo-register.tmpl: ./templates/echo/echo-register.tmpl
additional-imports:
  - alias: "."
    package: "github.com/algorand/go-algorand/daemon/algod/api/server/v2/generated/model"
output: ./server/v2/generated/participating/public/routes.go
