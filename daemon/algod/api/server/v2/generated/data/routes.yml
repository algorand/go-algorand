package: data
generate:
  echo-server: true
output-options:
  include-tags:
  - data
# do not include endpoints tagged public/experimental
# - public
  exclude-tags:
  - common
  - private
  - participating
  - nonparticipating
# do not exclude endpoints tagged data/experimental
# - experimental
  skip-prune: true
  user-templates:
    echo/echo-register.tmpl: ./templates/echo/echo-register.tmpl
output: ./server/v2/generated/data/routes.go
