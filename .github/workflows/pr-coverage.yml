name: PR Coverage

# Commenting "/coverage" on a pull request measures cross-package coverage for
# its head and attaches the result to that pull request in Codecov. PR builds do
# not measure coverage themselves; see .codecov.yml.
#
# issue_comment workflows always run this file as it exists on the default
# branch, so a pull request cannot change what it does. The job that checks the
# branch out still gets read-only permissions and no secrets.

on:
  issue_comment:
    types: [created]

env:
  CODECOV_TOKEN: "8b4a1f91-f154-4c26-b84c-c9aaa90159c6"  # Same public token from CircleCI config

concurrency:
  # Concurrency is evaluated per run, before the job conditions below, so any
  # comment would otherwise join this group and cancel a coverage run in
  # progress -- including one from somebody not allowed to start a run at all.
  # Only a request the authorize job would accept displaces one, so this has to
  # test what that job tests: keep the two conditions together.
  group: pr-coverage-${{ github.event.issue.pull_request && startsWith(github.event.comment.body, '/coverage') && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) && github.event.issue.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorize:
    # Only for "/coverage" on a pull request, and only from people who can
    # already push here, since this runs the pull request's code. The
    # concurrency group above tests the same thing; change them together.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/coverage') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Acknowledge the request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes
      - name: Resolve the pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Passed to Codecov below: this workflow runs on the default branch,
          # so an upload left to itself would land on master. Codecov names a
          # fork's branch "owner:branch".
          read -r SHA BRANCH < <(
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
              --jq 'if .head.repo.full_name == .base.repo.full_name
                    then "\(.head.sha) \(.head.ref)"
                    else "\(.head.sha) \(.head.label)" end'
          )
          if [[ -z "$SHA" || -z "$BRANCH" ]]; then
            echo "could not resolve the head of pull request #${{ github.event.issue.number }}" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  coverage:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        partition_id: [0, 1, 2, 3, 4, 5] # set PARTITION_TOTAL below to match
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Measured like the push build that publishes the baseline, so the two
      # are comparable. Only the partitioning differs.
      ALGORAND_DEADLOCK: enable
      KMD_NOUSB: True
      BUILD_TYPE: integration
      ALGOTEST: 1
      SKIP_GO_INSTALLATION: True
      CIRCLECI: true
      PARTITION_ID: ${{ matrix.partition_id }}
      PARTITION_TOTAL: 6
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@v4
        with:
          # The commit resolved above rather than the mutable head ref: a push
          # while these jobs are queued would otherwise leave partitions testing
          # different commits from the one the upload is attributed to.
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-prefix: test
      - name: Setup test environment
        uses: ./.github/actions/setup-test
      - name: Run tests
        uses: ./.github/actions/unit-tests
        with:
          parallel: '1'
          coverage: 'true'
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        env:
          # The job sets CIRCLECI for the tests; the uploader would otherwise
          # detect the wrong CI.
          GITHUB_ACTIONS: True
          CIRCLECI: ""
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.txt
          disable_search: true  # coverage.txt is the only report we want
          flags: unit
          override_commit: ${{ needs.authorize.outputs.sha }}
          override_branch: ${{ needs.authorize.outputs.branch }}
          override_pr: ${{ github.event.issue.number }}
          fail_ci_if_error: true  # the upload is the point of this job

  report:
    needs: [authorize, coverage]
    if: ${{ always() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: React with the outcome
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.coverage.result }}
        run: |
          if [[ "$RESULT" == "success" ]]; then
            CONTENT=rocket
          else
            CONTENT=confused
          fi
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content="$CONTENT"
      - name: Say so if it failed
        if: ${{ needs.coverage.result != 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "The \`/coverage\` run did not finish: [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
