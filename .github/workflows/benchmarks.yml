name: "Benchmark workflow"
on:
  # Push and update benchmarks when a commit is merged into master.
  push:
    branches:
      - master
  # Trigger benchmark test on this PR's commit against master.
  pull_request:
    branches:
      - master
permissions:
  # Push benchmark performance graph to gh-pages branch.
  contents: write
  deployments: write
jobs:
  benchmark:
    name: Performance regression check
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - run: go version
      - name: Build go-algorand
        run: |
          export SKIP_GO_INSTALLATION=True
          scripts/travis/build.sh
      # BenchmarkUintMath - Serves as a proxy for AVM `eval` performance.
      # Performance degradations suggest either or both:  (1) op code
      # degradation, (2) `eval` degradation.  (2) suggests a broader performance
      # issue. 
      - name: Run benchmark
        run: go test ./data/transactions/logic -bench 'BenchmarkUintMath' -run=^$ | tee benchmark_output.txt
      # Compare PRs with their base on the same hardware and Go toolchain.
      - name: Run base benchmark
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/benchmark-base"
          make libsodium
          go test ./data/transactions/logic -bench 'BenchmarkUintMath' -run=^$ | tee "$RUNNER_TEMP/benchmark-base.txt"
      - name: Record base benchmark
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: ${{ runner.temp }}/benchmark-base.txt
          external-data-json-path: ${{ runner.temp }}/benchmark-base.json
      - name: Set baseline commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The action labels every result with the PR head, even with ref set.
          # Give the baseline its own commit so the action compares the results.
          jq --arg sha "$BASE_SHA" '.entries["Go Benchmark"][0].commit.id = $sha' \
            "$RUNNER_TEMP/benchmark-base.json" > "$RUNNER_TEMP/benchmark-comparison.json"
      - name: Push benchmark result to gh-pages branch
        if: github.event_name == 'push'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
      - name: Evaluate benchmark on PR branch
        if: github.event_name == 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Go Benchmark
          tool: 'go'
          output-file-path: benchmark_output.txt
          external-data-json-path: ${{ runner.temp }}/benchmark-comparison.json
          save-data-file: false
          alert-threshold: '200%'
          fail-on-alert: true
          summary-always: true
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST --data-urlencode "payload={\"text\": \"Benchmark workflow failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \"}" "$SLACK_WEBHOOK_URL"
        if: ${{ failure() && (contains(github.ref_name, 'rel/nightly') || contains(github.ref_name, 'rel/beta') || contains(github.ref_name, 'rel/stable') || contains(github.ref_name, 'master')) }}
