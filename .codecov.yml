codecov:
  require_ci_to_pass: yes

# Every report uploaded here is measured the same way: "go test -coverpkg" over
# all go-algorand packages, uploaded under the full_coverage flag. Reports taken
# without -coverpkg count only the lines a package's own tests exercise; mixing
# the two made the coverage of a master commit depend on which workflow happened
# to upload for it, so PR jobs no longer submit coverage at all unless they were
# dispatched with full_coverage.

ignore:
  - "**/*_gen.go"
  - "**/*_gen_test.go"
  - "**/generated"
  - "**/*_string.go"  # ignore stringer-generated code

coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: auto
        informational: true
